name: Refresh NOAA and Open Waters tide predictions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-tides.yml"
      - "scripts/update_tides.py"
      - "scripts/update_openwaters.mjs"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-global-tides
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch NOAA predictions
        run: python scripts/update_tides.py --delay 1.5 --hours 48
      - name: Install Open Waters prediction packages
        run: npm install --no-save @slackwater/database@1.0.2-beta.0 @slackwater/engine@1.0.0-beta.13
      - name: Calculate licensed Open Waters predictions
        run: node scripts/update_openwaters.mjs
      - name: Commit refreshed tide data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh global tide predictions"
            git push
          fi
